[phases.setup]
nixPkgs = [
  "php82", "php82Extensions.pdo", "php82Extensions.pdo_pgsql",
  "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl",
  "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.gd",
  "php82Extensions.redis", "composer"
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]
# NOTE: APP_KEY must be set in Railway environment variables BEFORE first deploy.
# Generate with: php artisan key:generate --show (run locally, paste result to Railway)

[start]
cmd = "php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
