services:
  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: findmyhome-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-findmyhome}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-findmyhome}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend API (Go / Gin) ───────────────────────────────────────────────────
  api:
    build:
      context: ./findmyhome-go
      dockerfile: Dockerfile
    container_name: findmyhome-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      GIN_MODE: release
      ADDR: :8000
      DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_DATABASE:-findmyhome}?sslmode=disable
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_ENV: ${PESAPAL_ENV:-sandbox}
    ports:
      - "8000:8000"

  # ── Web Frontend (Next.js) ───────────────────────────────────────────────────
  web:
    build:
      context: ./findmyhome-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: findmyhome-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # ── Admin Panel (Next.js) ────────────────────────────────────────────────────
  admin:
    build:
      context: ./findmyhome-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: findmyhome-admin
    restart: always
    depends_on:
      - api
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

volumes:
  pgdata:
