[build]
builder = "nixpacks"

# The APP_KEY must be set manually in Railway environment variables.
# Generate it with: php artisan key:generate --show
# Then paste it into Railway dashboard → Variables → APP_KEY
# NEVER regenerate on deploy — it invalidates all user sessions.

[deploy]
startCommand = "php artisan migrate --force && php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
